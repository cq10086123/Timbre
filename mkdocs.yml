site_name: Timbre
site_description: "Timbre 是一款自由开源的 Android 有声书播放器，本地优先、无广告、无追踪，支持跳过片头片尾、自动封面与应用内更新。"
site_author: cq10086123
site_url: https://cq10086123.github.io/Timbre/

repo_url: https://github.com/cq10086123/Timbre
repo_name: "Timbre on GitHub"

nav:
  - 首页: index.md
  - 下载安装: download.md
  - 功能特性: features.md
  - 整理有声书: organizing.md
  - 常见问题: faq.md
  - 隐私政策: privacy.md
  - 许可证: license.md
  - 关于: about.md

theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - redirects:
      redirect_maps:
        'privacy_policy.md': 'privacy.md'
        'privacy.md': 'privacy.md'

copyright: Timbre · GPLv3 · 基于 <a href="https://github.com/PaulWoitaschek/Voice">Voice</a> 二次开发
