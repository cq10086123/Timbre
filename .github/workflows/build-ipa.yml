name: Build unsigned IPA

on:
  push:
    # iOS 代码在 Timbre_b 分支，main 是安卓工程，不要在那里触发
    branches: [Timbre_b]
    # ios-v* 触发发布：IPA 会挂到安卓同名版本（v3.6.3）的 Release 上，双端同包下载
    tags: ["v*", "ios-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: 编译未签名 IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（关闭签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Timbre.xcodeproj \
            -scheme Timbre \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            TIMBRE_COMMIT="$(git rev-parse --short=8 HEAD)" \
            TIMBRE_BUILD_DATE="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/build.log

      # 编译失败时把关键报错转成 annotation，这样即使拿不到完整日志也能看到错误原文
      - name: 汇总编译错误
        if: failure()
        run: |
          python3 - <<'PY'
          import re, os

          path = '/tmp/build.log'
          text = open(path, errors='replace').read() if os.path.exists(path) else ''
          lines = text.splitlines()

          errs = [l for l in lines if re.search(r'(error:|fatal error:)', l)]
          if not errs:
              errs = [l for l in lines if 'failed' in l.lower()][:40]
          if not errs:
              errs = lines[-60:]

          body = '\n'.join(errs[:80])
          body = body.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=xcodebuild 报错（前 %d 行）::%s' % (min(len(errs), 80), body[:60000]))
          PY

      - name: 打包未签名 IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "没有找到编译产物 .app"
            exit 1
          fi
          echo "产物：$APP_PATH"
          rm -rf Payload Timbre-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist" || true
          zip -qry Timbre-unsigned.ipa Payload
          ls -lh Timbre-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Timbre-unsigned-ipa
          path: Timbre-unsigned.ipa
          if-no-files-found: error

      # 以下仅推 tag 时执行：把 IPA 和安装说明挂到安卓同名版本的 Release
      # （iOS 版本号在 project.yml 里跟随安卓，如 3.6.3 → 安卓 Release 的 tag 是 v3.6.3）
      - name: 读取版本号
        run: |
          VERSION=$(sed -n 's/.*MARKETING_VERSION: "\([^"]*\)".*/\1/p' project.yml | head -n1)
          if [ -z "$VERSION" ]; then
            echo "从 project.yml 读不到 MARKETING_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # 注意：Release 附件名不支持中文（会被 GitHub 洗成 default.txt），文件名用 ASCII
      - name: 生成安装说明
        run: |
          cat > "install-guide.txt" <<EOF
          Timbre v${VERSION} 安装说明（双端）
          ====================================

          【安卓】timbre-v${VERSION}.apk
            下载后直接安装；系统提示「未知来源」时允许一次即可。

          【iOS】timbre-v${VERSION}-unsigned.ipa（未签名包）
            无法直接安装，需自行签名，常用方式三选一：
            1. TrollStore：支持 iOS 14.0～16.6.1（部分 17.0），导入 ipa 直接装；
            2. AltStore / SideStore / Sideloadly：需配合电脑与 Apple ID，证书 7 天有效需续签；
            3. 自有开发者账号 / 企业签：用签名工具对此 ipa 签名后安装。

          【说明】
            - iOS 版为功能验证版，功能以安卓端为准（暂缺引导页、桌面小组件等）；
            - 未签名 ipa 仅供验证，请勿二次分发；
            - 源码：安卓在 main 分支，iOS 在 Timbre_b 分支（Timbre-iOS/ 目录）。
          EOF

      - name: 发布（附加到安卓同名版本的 Release）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA_NAME="timbre-v${VERSION}-unsigned.ipa"
          mv Timbre-unsigned.ipa "$IPA_NAME"
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 安卓已发同名版本：只追加附件，不动 Release 的标题/正文/属性
            gh release upload "v${VERSION}" "$IPA_NAME" "install-guide.txt" --clobber --repo "$GITHUB_REPOSITORY"
            echo "已附加到现有 Release v${VERSION}"
          else
            # 兜底：安卓还没发这个版本时，iOS 自建一个预发布，不抢 Latest
            gh release create "v${VERSION}" "$IPA_NAME" "install-guide.txt" \
              --prerelease \
              --title "v${VERSION} 验证版（iOS 未签名调试包，禁止下载分发）" \
              --notes "安卓端此版本尚未发布，iOS 包先挂在这里；正式版以安卓端 Release 为准。" \
              --repo "$GITHUB_REPOSITORY"
          fi
