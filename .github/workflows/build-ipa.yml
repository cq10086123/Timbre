name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: 编译未签名 IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（关闭签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Timbre.xcodeproj \
            -scheme Timbre \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build

      - name: 打包未签名 IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "没有找到编译产物 .app"
            exit 1
          fi
          echo "产物：$APP_PATH"
          rm -rf Payload Timbre-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist" || true
          zip -qry Timbre-unsigned.ipa Payload
          ls -lh Timbre-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Timbre-unsigned-ipa
          path: Timbre-unsigned.ipa
          if-no-files-found: error

      - name: 发布到 Release（推送 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Timbre-unsigned.ipa
          generate_release_notes: true
