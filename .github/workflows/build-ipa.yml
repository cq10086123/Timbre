name: Build unsigned IPA

on:
  push:
    # iOS 代码在 Timbre_b 分支，main 是安卓工程，不要在那里触发
    branches: [Timbre_b]
    # 打 ios-v3.6.3 这类 tag 也会发布。**不能**用 v3.6.3：那个 tag 指向 main 上的
    # 安卓 commit，而那上面没有本文件，GitHub 只会去 tag 指向的 commit 找 workflow
    tags: ["ios-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: '要附加到的版本号，须与安卓 Release 的 tag 一致（如 3.6.3）。留空 = 只编译、不发布'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-ipa:
    name: 编译未签名 IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 解析版本号
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 版本号只认一个真源头：手动触发时填的那个（与安卓 versionName 一致）。
          # 这样 project.yml 不用每次发版都改，避免「两处版本号忘了同步」。
          V=""
          PUBLISH=0
          if [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
            PUBLISH=1
          fi
          if [ -z "$V" ] && [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            V="${GITHUB_REF#refs/tags/ios-v}"
            PUBLISH=1
          fi
          # 没有发布意图（普通 push）：按 project.yml 编译，只出 artifact
          if [ -z "$V" ]; then
            # 这里不能用 `sed ... | head -n1`：开了 pipefail 之后，head 取到第一行就关管道，
            # sed 收到 SIGPIPE 返回 141，整个命令替换被判失败，set -e 直接把这一步干掉
            # （2026-11-04 实际挂在这，构建 status=failure）
            V=$(sed -n 's/.*MARKETING_VERSION: "\([^"]*\)".*/\1/p' project.yml)
            V="${V%%$'\n'*}"
          fi
          if [ -z "$V" ]; then
            echo "取不到版本号"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "版本号 $V（发布=$PUBLISH）"

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（关闭签名）
        env:
          VERSION_INPUT: ${{ steps.ver.outputs.version }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Timbre.xcodeproj \
            -scheme Timbre \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION_INPUT" \
            TIMBRE_COMMIT="$(git rev-parse --short=8 HEAD)" \
            TIMBRE_BUILD_DATE="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/build.log

      # 编译失败时把关键报错转成 annotation，这样即使拿不到完整日志也能看到错误原文
      - name: 汇总编译错误
        if: failure()
        run: |
          python3 - <<'PY'
          import re, os

          path = '/tmp/build.log'
          text = open(path, errors='replace').read() if os.path.exists(path) else ''
          lines = text.splitlines()

          errs = [l for l in lines if re.search(r'(error:|fatal error:)', l)]
          if not errs:
              errs = [l for l in lines if 'failed' in l.lower()][:40]
          if not errs:
              errs = lines[-60:]

          body = '\n'.join(errs[:80])
          body = body.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=xcodebuild 报错（前 %d 行）::%s' % (min(len(errs), 80), body[:60000]))
          PY

      - name: 打包未签名 IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "没有找到编译产物 .app"
            exit 1
          fi
          echo "产物：$APP_PATH"
          rm -rf Payload Timbre-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist" || true
          zip -qry Timbre-unsigned.ipa Payload
          ls -lh Timbre-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Timbre-unsigned-ipa
          path: Timbre-unsigned.ipa
          if-no-files-found: error

      # 以下只在「有发布意图」时执行（手动触发填了版本号，或打了 ios-v* tag）：
      # 把 IPA 和鸿蒙占位包挂到安卓同名版本的 Release，双端在同一个页面下载
      - name: 发布（附加到安卓同名版本的 Release）
        if: steps.ver.outputs.publish == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          IPA_NAME="timbre-v${VERSION}-unsigned.ipa"
          HMOS_ASSET="harmony-coming-soon.zip"
          mv Timbre-unsigned.ipa "$IPA_NAME"

          # 鸿蒙版占位包：安卓 + iOS + 鸿蒙三端共用一个 Release，这里先放一个说明包，
          # 上线后换成 .hap。注意 GitHub 自动生成的 Source code (zip/tar.gz) 两份删不掉，
          # 所以资产栏固定是「apk + ipa + 鸿蒙 + 2 份源码」
          # 文件名用英文：中文名上传后下载链接会被整段 URL 编码，不好复制
          printf '%s\n' \
            "鸿蒙版（HarmonyOS）正在开发中，敬请期待。" \
            "上线后会在这里提供安装包，关注 Releases 页面即可。" \
            > hmos-note.txt
          rm -f "$HMOS_ASSET"
          zip -qj "$HMOS_ASSET" hmos-note.txt
          rm -f hmos-note.txt

          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 安卓已发同名版本：只追加附件，不动 Release 的标题/正文/属性
            gh release upload "v${VERSION}" "$IPA_NAME" "$HMOS_ASSET" \
              --clobber --repo "$GITHUB_REPOSITORY"
            echo "已附加到现有 Release v${VERSION}"
          else
            # 兜底：安卓还没发这个版本时，iOS 自建一个预发布，不抢 Latest
            gh release create "v${VERSION}" "$IPA_NAME" "$HMOS_ASSET" \
              --prerelease \
              --title "v${VERSION} 验证版（iOS 未签名调试包，禁止下载分发）" \
              --notes "安卓端此版本尚未发布，iOS 包先挂在这里；正式版以安卓端 Release 为准。" \
              --repo "$GITHUB_REPOSITORY"
          fi
