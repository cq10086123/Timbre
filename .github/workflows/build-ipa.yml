name: Build unsigned IPA

on:
  push:
    # iOS 代码在 Timbre_b 分支，main 是安卓工程，不要在那里触发
    branches: [Timbre_b]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: 编译未签名 IPA
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers

      - name: 安装 XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（关闭签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Timbre.xcodeproj \
            -scheme Timbre \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            TIMBRE_COMMIT="$(git rev-parse --short=8 HEAD)" \
            TIMBRE_BUILD_DATE="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/build.log

      # 编译失败时把关键报错转成 annotation，这样即使拿不到完整日志也能看到错误原文
      - name: 汇总编译错误
        if: failure()
        run: |
          python3 - <<'PY'
          import re, os

          path = '/tmp/build.log'
          text = open(path, errors='replace').read() if os.path.exists(path) else ''
          lines = text.splitlines()

          errs = [l for l in lines if re.search(r'(error:|fatal error:)', l)]
          if not errs:
              errs = [l for l in lines if 'failed' in l.lower()][:40]
          if not errs:
              errs = lines[-60:]

          body = '\n'.join(errs[:80])
          body = body.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=xcodebuild 报错（前 %d 行）::%s' % (min(len(errs), 80), body[:60000]))
          PY

      - name: 打包未签名 IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "没有找到编译产物 .app"
            exit 1
          fi
          echo "产物：$APP_PATH"
          rm -rf Payload Timbre-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist" || true
          zip -qry Timbre-unsigned.ipa Payload
          ls -lh Timbre-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Timbre-unsigned-ipa
          path: Timbre-unsigned.ipa
          if-no-files-found: error

      - name: 发布到 Release（推送 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Timbre-unsigned.ipa
          generate_release_notes: true
