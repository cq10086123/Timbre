name: Release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: '版本名 versionName，如 1.0.0'
        required: true
      versionCode:
        description: '版本号 versionCode（整数，可留空：留空则自动取上次发布 +1）'
        required: false
        default: ''
      releaseNotes:
        description: '自定义更新内容（可留空：留空则自动生成 release notes）'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build_setup

      - name: 解析 versionCode（留空则自动取上次发布 +1）
        id: ver
        env:
          INPUT_CODE: ${{ inputs.versionCode }}
        run: |
          LAST=$(sed -n 's/.*"versionCode": *\([0-9][0-9]*\).*/\1/p' update.json 2>/dev/null | tail -n 1)
          LAST=${LAST:-0}
          if [ -n "$INPUT_CODE" ]; then
            CODE="$INPUT_CODE"
          else
            CODE=$((LAST + 1))
            echo "未填 versionCode，依据 update.json（上次=$LAST）自动使用 $CODE"
          fi
          if [ "$CODE" -lt "$LAST" ]; then
            echo "::error::versionCode=$CODE 低于已发布的 $LAST（见 update.json），会造成降级，请填写更大的值"
            exit 1
          fi
          if [ "$CODE" -eq "$LAST" ]; then
            echo "::warning::versionCode=$CODE 与上次发布相同，建议递增"
          fi
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"

      - name: 写入签名配置
        env:
          TIMBRE_KEYSTORE_BASE64: ${{ secrets.TIMBRE_KEYSTORE_BASE64 }}
          TIMBRE_STORE_PASSWORD: ${{ secrets.TIMBRE_STORE_PASSWORD }}
          TIMBRE_KEY_ALIAS: ${{ secrets.TIMBRE_KEY_ALIAS }}
          TIMBRE_KEY_PASSWORD: ${{ secrets.TIMBRE_KEY_PASSWORD }}
        run: |
          mkdir -p signing
          echo "$TIMBRE_KEYSTORE_BASE64" | base64 --decode > signing/signing.keystore
          {
            echo "STORE_PASSWORD=$TIMBRE_STORE_PASSWORD"
            echo "KEY_ALIAS=$TIMBRE_KEY_ALIAS"
            echo "KEY_PASSWORD=$TIMBRE_KEY_PASSWORD"
          } > signing/signing.properties

      - name: 构建 Release APK
        run: |
          ./gradlew assembleFreeRelease \
            -Pvoice.versionName="${{ inputs.versionName }}" \
            -Pvoice.versionCode="${{ steps.ver.outputs.versionCode }}"
          test -f app/build/outputs/apk/free/release/app-free-release.apk

      - name: 上传 APK 到构建产物
        uses: actions/upload-artifact@v4
        with:
          name: timbre-v${{ inputs.versionName }}
          path: app/build/outputs/apk/free/release/app-free-release.apk

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_NOTES: ${{ inputs.releaseNotes }}
        run: |
          # 非 main 分支发的是独立版本线，版本号可能低于 main 已发布版本
          # （例如 3.5.0 低于 3.6.3）。不标 prerelease 会让 GitHub 把它设成
          # 仓库的 latest，首页与 /releases/latest 会把一条更旧的代码线
          # 当成最新正式版展示；标了之后照常可下载，只是不抢 latest
          EXTRA=""
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            EXTRA="--prerelease"
          fi
          cp app/build/outputs/apk/free/release/app-free-release.apk \
            "timbre-v${{ inputs.versionName }}.apk"
          if [ -n "$INPUT_NOTES" ]; then
            NOTES_FILE=$(mktemp)
            printf '%s' "$INPUT_NOTES" > "$NOTES_FILE"
            gh release create "v${{ inputs.versionName }}" \
              "timbre-v${{ inputs.versionName }}.apk" \
              --title "Timbre v${{ inputs.versionName }}" \
              --notes-file "$NOTES_FILE" \
              --target "$GITHUB_SHA" $EXTRA
          else
            gh release create "v${{ inputs.versionName }}" \
              "timbre-v${{ inputs.versionName }}.apk" \
              --title "Timbre v${{ inputs.versionName }}" \
              --generate-notes \
              --target "$GITHUB_SHA" $EXTRA
          fi

      - name: 更新 update.json 供应用内检查更新
        # 只在 main 上发布时回写 update.json。其他分支是独立版本，版本号可能
        # 低于 main 已发布的版本（例如 3.5.0 低于 3.6.3），回写会让装着正式版
        # 的用户收到一条版本更旧、功能更少的「更新」提示；而且此时 HEAD 与
        # main 未分叉与否不确定，push HEAD:main 本身也会失败
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the in-app update dialog renders the release notes: fetch the body
          # the release was created with (--generate-notes) and embed it. jq
          # escapes newlines and quotes so update.json stays valid JSON
          NOTES=$(gh release view "v${{ inputs.versionName }}" --json body -q .body)
          jq -n \
            --arg versionName "${{ inputs.versionName }}" \
            --argjson versionCode "${{ steps.ver.outputs.versionCode }}" \
            --arg releaseUrl "https://github.com/cq10086123/Timbre/releases/latest" \
            --arg releaseNotes "$NOTES" \
            '{versionName: $versionName, versionCode: $versionCode, releaseUrl: $releaseUrl, releaseNotes: $releaseNotes}' > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json unchanged"
          else
            git commit -m "Publish update.json for v${{ inputs.versionName }}"
            for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "::error::Could not push update.json to main after 3 attempts"
          exit 1
          fi
