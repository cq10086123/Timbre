name: Debug Build Feedback

on:
  pull_request:

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          # let the format step push back to the branch
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build_setup
      - name: Auto-format kotlin
        id: format
        run: |
          ./gradlew formatKotlin || true
          if [ -n "$(git status --porcelain -- '*.kt' '*.kts')" ]; then
            git config user.name "timbre-ci-bot"
            git config user.email "ci@timbre.local"
            git add -A
            git commit -m "style: ktlint 自动格式化" --quiet
            git push
            echo "formatted=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build + Test (errors to annotations)
        id: build
        run: |
          set -o pipefail
          ./gradlew voiceUnitTest :app:assembleFreeDebug 2>&1 | tee /tmp/build.log
      - name: Emit error annotations
        if: failure()
        shell: bash
        run: |
          grep -nE "^e: |error: |Caused by: |Execution failed for task" /tmp/build.log | head -60 | while IFS= read -r line; do
            line=${line:0:200}
            echo "::error::${line//%/}"
          done
          echo "---- last 80 lines ----"
          tail -80 /tmp/build.log
